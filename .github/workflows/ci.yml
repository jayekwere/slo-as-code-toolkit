name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4, upstream release commit
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, upstream release commit
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked environment
        run: |
          python -m pip install uv==0.13.6
          uv sync --frozen --all-extras
      - name: Lint and types
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy sloctl
      - name: Offline tests and coverage
        run: uv run --frozen pytest --junitxml=junit.xml
      - name: Complete local demonstration
        run: uv run --frozen sloctl demo --output-dir demo-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-evidence-${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml
            demo-output/
          retention-days: 14
  supply-chain:
    name: Dependencies and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install uv==0.13.6
          uv sync --frozen --all-extras
      - name: Verify runtime lock export
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file /tmp/requirements.lock
          diff -u <(tail -n +3 requirements.lock) <(tail -n +3 /tmp/requirements.lock)
      - name: Dependency vulnerability scan
        run: uv run --frozen pip-audit --disable-pip --no-deps --require-hashes -r requirements.lock --format json --output audit-report.json
      - name: Secret scan
        run: bash scripts/scan_secrets.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: supply-chain-evidence
          path: |
            audit-report.json
            gitleaks-report.json
          retention-days: 14
  build:
    name: Reproducible packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install uv==0.13.6
          uv sync --frozen --all-extras
      - name: Build twice and compare
        run: uv run --frozen python scripts/reproducible_build.py
      - name: Installed package smoke test
        run: |
          python -m venv /tmp/slo-smoke
          uv pip install --python /tmp/slo-smoke/bin/python --require-hashes -r requirements.lock
          uv pip install --python /tmp/slo-smoke/bin/python --no-deps dist/*.whl
          cd /tmp
          /tmp/slo-smoke/bin/sloctl --help
          /tmp/slo-smoke/bin/sloctl demo --output-dir /tmp/installed-demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distributions
          path: dist/
          retention-days: 30
